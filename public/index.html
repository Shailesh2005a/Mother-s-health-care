<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Clinic Management System</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; background: #f2f4f8; }
    #loginPage, #dashboard, #viewPatientsPage, #viewMedicinesPage { display: none; padding: 20px; }
    .login-box {
      max-width: 400px; margin: 100px auto; padding: 30px; background: white;
      border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .login-box h2 { text-align: center; }
    .login-box input, .login-box button {
      width: 100%; margin: 10px 0; padding: 10px;
      border: 1px solid #ccc; border-radius: 6px;
    }
    .login-box button {
      background: #007bff; color: white; border: none; cursor: pointer;
    }
    #dashboard { text-align: center; }
    #dashboard h2 { margin-bottom: 30px; }
    .dashboard-buttons button {
      display: block; margin: 10px auto; padding: 12px 20px;
      background-color: #007bff; color: white; border: none;
      border-radius: 8px; cursor: pointer; width: 200px;
    }
    .overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); display: none;
      justify-content: center; align-items: center; z-index: 999;
    }
    .overlay form {
      background: white; padding: 20px; width: 90%; max-width: 500px;
      border-radius: 10px; max-height: 80vh; overflow-y: auto;
    }
    .overlay input, .overlay textarea {
      width: 100%; margin: 8px 0; padding: 10px;
      border: 1px solid #ccc; border-radius: 6px;
    }
    .overlay button {
      padding: 10px 20px; background: #007bff;
      color: white; border: none; border-radius: 6px; cursor: pointer;
    }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    table th, table td { border: 1px solid #ddd; padding: 10px; vertical-align: top; }
    table th { background-color: #007bff; color: white; }
    .back-button, .action-btn {
      margin-top: 10px; padding: 6px 10px;
      background-color: #007bff; color: white;
      border: none; border-radius: 6px; cursor: pointer;
    }
    .action-btn { margin: 0 2px; }
    td p { margin: 4px 0; }
    .search-bar {
      margin: 10px 0;
    }
    .search-bar input {
      padding: 8px; width: 200px; margin-right: 10px;
      border: 1px solid #ccc; border-radius: 6px;
    }
  </style>
</head>
<body>

<!-- Login Page -->
<div id="loginPage">
  <div class="login-box">
    <h2>Login</h2>
    <input type="text" id="username" placeholder="Username" />
    <input type="password" id="password" placeholder="Password" />
    <button onclick="login()">Login</button>
  </div>
</div>

<!-- Dashboard -->
<div id="dashboard">
  <h2>Welcome to Clinic Dashboard</h2>
  <div class="dashboard-buttons">
    <button onclick="showOverlay('patient')">Add Patient</button>
    <button onclick="showView('patients')">View Patients</button>
    <button onclick="showOverlay('medicine')">Add Medicine</button>
    <button onclick="showView('medicines')">View Medicines</button>
  </div>
</div>

<!-- Add Patient Overlay -->
<div id="patientOverlay" class="overlay">
  <form onsubmit="savePatient(event)">
    <h3 id="patientFormTitle">Add Patient</h3>
    <input type="text" id="pname" placeholder="Full Name" required />
    <input type="date" id="pdob" required />
    <input type="text" id="pgender" placeholder="Gender" required />
    <input type="text" id="pblood" placeholder="Blood Group" />
    <input type="text" id="pweight" placeholder="Weight (kg)" />
    <input type="text" id="pheight" placeholder="Height (cm)" />
    <input type="tel" id="pphone" placeholder="Phone" />
    <input type="tel" id="paltphone" placeholder="Alternate Phone" />
    <input type="email" id="pemail" placeholder="Email" />
    <input type="text" id="pcity" placeholder="City" />
    <input type="text" id="pstate" placeholder="State" />
    <input type="text" id="pmedicines" placeholder="Medicines Taken" />
    <textarea id="psummary" placeholder="Summary"></textarea>
    <textarea id="pprescription" placeholder="Prescription"></textarea>
    <input type="date" id="plastvisit" placeholder="Last Visit" />
    <button type="submit">Save</button>
    <button type="button" onclick="hideOverlay('patient')">Cancel</button>
  </form>
</div>

<!-- Add Medicine Overlay -->
<div id="medicineOverlay" class="overlay">
  <form onsubmit="saveMedicine(event)">
    <h3 id="medicineFormTitle">Add Medicine</h3>
    <input type="text" id="mname" placeholder="Medicine Name" required />
    <input type="number" id="mqty" placeholder="Quantity" required />
    <button type="submit">Save</button>
    <button type="button" onclick="hideOverlay('medicine')">Cancel</button>
  </form>
</div>

<!-- View Patients -->
<div id="viewPatientsPage">
  <h2>All Patients</h2>
  <div class="search-bar">
    <input type="text" id="searchName" placeholder="Search by Name" oninput="filterPatients()" />
    <input type="text" id="searchMedicine" placeholder="Search by Medicine" oninput="filterPatients()" />
  </div>
  <table>
    <thead><tr><th>#</th><th>Patient Details</th><th>Actions</th></tr></thead>
    <tbody id="patientTable"></tbody>
  </table>
  <button class="back-button" onclick="goBackToDashboard()">Back</button>
</div>

<!-- View Medicines -->
<div id="viewMedicinesPage">
  <h2>All Medicines</h2>
  <div class="search-bar">
    <input type="text" id="searchMedicineName" placeholder="Search by Medicine Name" oninput="filterMedicines()" />
  </div>
  <table>
    <thead><tr><th>#</th><th>Name</th><th>Quantity</th><th>Actions</th></tr></thead>
    <tbody id="medicineTable"></tbody>
  </table>
  <button class="back-button" onclick="goBackToDashboard()">Back</button>
</div>

<script>
  let patients = [], medicines = [];
  let editPatientIndex = -1, editMedicineIndex = -1;

  const loginPage = document.getElementById("loginPage");
  const dashboard = document.getElementById("dashboard");
  const viewPatientsPage = document.getElementById("viewPatientsPage");
  const viewMedicinesPage = document.getElementById("viewMedicinesPage");

  window.onload = () => loginPage.style.display = 'block';

  function login() {
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;
    if (username === 'admin' && password === 'admin123') {
      loginPage.style.display = 'none';
      dashboard.style.display = 'block';
    } else {
      alert('Invalid credentials');
    }
  }

  function showOverlay(type, index = -1) {
    if (type === 'patient') {
      document.getElementById("patientOverlay").style.display = 'flex';
      document.getElementById("patientFormTitle").textContent = index >= 0 ? "Edit Patient" : "Add Patient";
      editPatientIndex = index;
      const form = document.querySelector('#patientOverlay form');
      if (index >= 0) {
        const p = patients[index];
        pname.value = p.name; pdob.value = p.dob; pgender.value = p.gender;
        pblood.value = p.blood; pweight.value = p.weight; pheight.value = p.height;
        pphone.value = p.phone; paltphone.value = p.altphone; pemail.value = p.email;
        pcity.value = p.city; pstate.value = p.state; pmedicines.value = p.medicines;
        psummary.value = p.summary; pprescription.value = p.prescription; plastvisit.value = p.lastvisit;
      } else {
        form.reset();
      }
    } else {
      document.getElementById("medicineOverlay").style.display = 'flex';
      document.getElementById("medicineFormTitle").textContent = index >= 0 ? "Edit Medicine" : "Add Medicine";
      editMedicineIndex = index;
      const form = document.querySelector('#medicineOverlay form');
      if (index >= 0) {
        mname.value = medicines[index].name;
        mqty.value = medicines[index].qty;
      } else {
        form.reset();
      }
    }
  }

  function hideOverlay(type) {
    document.getElementById(type + 'Overlay').style.display = 'none';
    editPatientIndex = editMedicineIndex = -1;
  }

  function savePatient(e) {
    e.preventDefault();
    const p = {
      name: pname.value, dob: pdob.value, gender: pgender.value, blood: pblood.value,
      weight: pweight.value, height: pheight.value, phone: pphone.value, altphone: paltphone.value,
      email: pemail.value, city: pcity.value, state: pstate.value, medicines: pmedicines.value,
      summary: psummary.value, prescription: pprescription.value, lastvisit: plastvisit.value
    };
    if (editPatientIndex >= 0) patients[editPatientIndex] = p;
    else patients.push(p);
    hideOverlay('patient');
    showView('patients');
  }

  function saveMedicine(e) {
    e.preventDefault();
    const m = { name: mname.value, qty: mqty.value };
    if (editMedicineIndex >= 0) medicines[editMedicineIndex] = m;
    else medicines.push(m);
    hideOverlay('medicine');
    showView('medicines');
  }

  function deleteItem(index, type) {
    if (type === 'patient') patients.splice(index, 1);
    else medicines.splice(index, 1);
    showView(type === 'patient' ? 'patients' : 'medicines');
  }

  function showView(type) {
    dashboard.style.display = 'none';
    if (type === 'patients') {
      viewPatientsPage.style.display = 'block';
      filterPatients();
    } else {
      viewMedicinesPage.style.display = 'block';
      filterMedicines();
    }
  }

  function goBackToDashboard() {
    viewPatientsPage.style.display = 'none';
    viewMedicinesPage.style.display = 'none';
    dashboard.style.display = 'block';
  }

  function filterPatients() {
    const nameFilter = document.getElementById("searchName").value.toLowerCase();
    const medFilter = document.getElementById("searchMedicine").value.toLowerCase();
    const table = document.getElementById("patientTable");
    table.innerHTML = patients.map((p, i) => {
      if (
        (p.name.toLowerCase().includes(nameFilter)) &&
        (p.medicines.toLowerCase().includes(medFilter))
      ) {
        return `
        <tr>
          <td>${i+1}</td>
          <td>
            <p><strong>Name:</strong> ${p.name}</p>
            <p><strong>DOB:</strong> ${p.dob}</p>
            <p><strong>Gender:</strong> ${p.gender}</p>
            <p><strong>Blood Group:</strong> ${p.blood}</p>
            <p><strong>Weight:</strong> ${p.weight}</p>
            <p><strong>Height:</strong> ${p.height}</p>
            <p><strong>Phone:</strong> ${p.phone}</p>
            <p><strong>Alt Phone:</strong> ${p.altphone}</p>
            <p><strong>Email:</strong> ${p.email}</p>
            <p><strong>City:</strong> ${p.city}</p>
            <p><strong>State:</strong> ${p.state}</p>
            <p><strong>Medicines Taken:</strong> ${p.medicines}</p>
            <p><strong>Summary:</strong> ${p.summary}</p>
            <p><strong>Prescription:</strong> ${p.prescription}</p>
            <p><strong>Last Visit:</strong> ${p.lastvisit}</p>
          </td>
          <td>
            <button class="action-btn" onclick="showOverlay('patient', ${i})">Edit</button>
            <button class="action-btn" onclick="deleteItem(${i}, 'patient')">Delete</button>
          </td>
        </tr>`;
      } else return '';
    }).join('');
  }

  function filterMedicines() {
    const filter = document.getElementById("searchMedicineName").value.toLowerCase();
    const table = document.getElementById("medicineTable");
    table.innerHTML = medicines.map((m, i) => {
      if (m.name.toLowerCase().includes(filter)) {
        return `<tr><td>${i+1}</td><td>${m.name}</td><td>${m.qty}</td>
          <td>
            <button class="action-btn" onclick="showOverlay('medicine', ${i})">Edit</button>
            <button class="action-btn" onclick="deleteItem(${i}, 'medicine')">Delete</button>
          </td></tr>`;
      } else return '';
    }).join('');
  }
</script>

</body>
</html>
